<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple BMI Calculator</title>
    <link rel="stylesheet" href="BMI.css">
</head>
<body>

    <div class="calculator">

        <h1>My BMI Calculator</h1>
        <p class="intro">Check your body weight easily.</p>

        <div class="input-box">
            <label>Enter your weight (kg)</label>
            <input type="number" id="weight" placeholder="e.g. 60">
        </div>

        <div class="input-box">
            <label>Enter your height (cm)</label>
            <input type="number" id="height" placeholder="e.g. 170">
        </div>

        <button onclick="calculateBMI()">Calculate BMI</button>

        <button class="reset" onclick="resetCalculator()">Reset</button>

        <div class="result">
            <h2>Your Result</h2>
            <h1 id="bmi">--</h1>
            <h3 id="category">Waiting for result...</h3>
            <p id="message">Your BMI result will appear here.</p>
        </div>

        <div class="guide">
            <h3>BMI Guide</h3>
            <p>Below 18.5 - Underweight</p>
            <p>18.5 - 24.9 - Normal weight</p>
            <p>25 - 29.9 - Overweight</p>
            <p>30 and above - Obese</p>
        </div>

    </div>

    <script src="BMI.js"></script>
</body>
</html>
